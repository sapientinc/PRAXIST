site_name: Praxist
site_description: Install, operate, understand, and extend the Praxist autonomous research system.
site_url: https://praxist.sapient.inc/en/docs
repo_url: https://github.com/sapientinc/praxist
repo_name: Praxist on GitHub
edit_uri: ""
docs_dir: docs
site_dir: site
strict: true
use_directory_urls: false
exclude_docs: |
  site/**

theme:
  name: material
  language: en
  logo: Praxist.svg
  favicon: assets/brand/praxist-mark.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link
    - toc.follow

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/page-morphicons.mjs

extra:
  generator: false

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - .
          options:
            docstring_style: google
            members_order: source
            show_bases: true
            show_if_no_docstring: false
            show_source: false
            show_root_full_path: false
            show_root_heading: true
            show_signature_annotations: true
            separate_signature: true

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

