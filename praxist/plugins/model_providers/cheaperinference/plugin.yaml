schema_version: 1
name: cheaperinference
kind: model_provider
version: 0.1.0
protocol_version: 1
stability: experimental
description: Cheaper Inference provider adapter spec.
compatibility:
  praxist_core: ">=0.1.0,<1.0"
  python: ">=3.11"
dependencies: []
capabilities:
  - provider.cheaperinference
  - provider.routing
provider:
  api_format: cheaperinference
  default_model: gpt-5.4-mini
  cache_strategy: provider_default
  usage_reporting: usage_or_usage_unknown
  model_profiles:
    cheap_peer: gpt-5.4-mini
    strong_reasoner: gpt-5.4
  compatible_model_patterns:
    - "*"
entrypoint: adapter:create_provider
code:
  - adapter.py
assets: []
