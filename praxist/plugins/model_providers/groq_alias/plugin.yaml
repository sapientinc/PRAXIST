schema_version: 1
name: groq_alias
kind: model_provider
version: 0.1.0
protocol_version: 1
stability: experimental
description: Groq alias on the OpenAI-compatible adapter path.
compatibility:
  praxist_core: ">=0.1.0,<1.0"
  python: ">=3.11"
dependencies: []
capabilities:
  - provider.openai_compatible
  - provider.groq
provider:
  api_format: groq
  default_model: openai/gpt-oss-20b
  cache_strategy: provider_default
  usage_reporting: usage_or_usage_unknown
  model_profiles:
    cheap_peer: openai/gpt-oss-20b
    strong_reasoner: openai/gpt-oss-120b
  compatible_model_patterns:
    - "openai/*"
    - "qwen/*"
    - "meta-llama/*"
    - "groq/*"
    - "groq*"
    - "allam-*"
    - "llama*"
    - "mixtral*"
    - "gemma*"
entrypoint: adapter:create_provider
code:
  - adapter.py
assets: []
