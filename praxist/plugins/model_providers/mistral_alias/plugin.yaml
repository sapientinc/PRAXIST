schema_version: 1
name: mistral_alias
kind: model_provider
version: 0.1.0
protocol_version: 1
stability: experimental
description: Mistral alias on the OpenAI-compatible adapter path.
compatibility:
  praxist_core: ">=0.1.0,<1.0"
  python: ">=3.11"
dependencies: []
capabilities:
  - provider.openai_compatible
  - provider.mistral
provider:
  api_format: openai_compatible
  default_model: mistral-large-latest
  cache_strategy: provider_default
  usage_reporting: usage_or_usage_unknown
  model_profiles:
    cheap_peer: mistral-small-latest
    strong_reasoner: mistral-large-latest
  compatible_model_patterns:
    - "mistral*"
    - "codestral*"
    - "ministral*"
    - "open-mistral*"
    - "pixtral*"
entrypoint: adapter:create_provider
code:
  - adapter.py
assets: []
